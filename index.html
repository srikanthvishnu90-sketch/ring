<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ring — app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000; --surface:#121212; --surface-2:#1A1A1A;
  --brown:#22140F; --brown-2:#1A100B; --brown-line:#33231A; --brown-hi:#3D271C;
  --silver:#C9CCD1; --silver-hi:#DDE0E4;
  --silver-grad:linear-gradient(135deg,#EDEFF2 0%,#BFC3CA 42%,#DCDFE3 68%,#A9AEB6 100%);
  --silver-card:radial-gradient(85% 70% at 18% 0%,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 70%),linear-gradient(158deg,#E6E8EB 0%,#C4C8CE 55%,#A9AEB6 100%);
  --brown-card:radial-gradient(85% 60% at 22% 10%,rgba(255,232,210,.10) 0%,rgba(255,232,210,0) 70%),linear-gradient(158deg,rgba(255,255,255,.035) 0%,rgba(0,0,0,0) 45%,rgba(0,0,0,.30) 100%),#22140F;
  --sage:#A9C2A6; --sage-dark:#2F5236;
  --text:#FFFFFF; --ink:#16110E; --muted:#A89C92; --muted-2:#8F857D;
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.06);
  --amber:#F5B731; --red:#FF3B30;
  --serif:'Newsreader','Times New Roman',serif;
  --sans:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
  --tabbar:64px;
  --st:0px; --sb:0px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--black:#000000;--text:#FFFFFF}}
:root[data-theme="dark"]{--black:#000000;--text:#FFFFFF}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--black);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}

/* ---------- app shell ---------- */
.app{max-width:520px;margin:0 auto;position:relative;min-height:100%}
#device{position:relative;width:100%;height:100%;overflow:hidden;background:var(--black);transform:translateZ(0)}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none}
.sbar,.island,.homebar{display:none}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 50% at 50% 40%,#1A100B 0%,#120C09 55%,#070504 100%)}
  #device{width:393px;height:852px;flex-shrink:0;border-radius:56px;--st:54px;--sb:30px;box-shadow:0 0 0 11px #0B0B0B,0 0 0 12.5px #3C3F44,0 0 0 14px #1A1A1A,0 40px 90px rgba(0,0,0,.65);transform-origin:center center}
  .sbar{display:flex;position:absolute;top:0;left:0;right:0;height:54px;padding:18px 34px 0 44px;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:16px;z-index:80;pointer-events:none;color:#fff;letter-spacing:.01em}
  .island{display:block;position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:81;pointer-events:none}
  .homebar{display:block;position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:rgba(255,255,255,.85);z-index:81;pointer-events:none}
}
.view{padding:calc(var(--st) + 20px) 20px calc(var(--tabbar) + var(--sb) + 32px);display:flex;flex-direction:column;gap:26px}
.view[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.view>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}
.view>*:nth-child(3){animation-delay:.1s}
.view>*:nth-child(4){animation-delay:.15s}
.view>*:nth-child(5){animation-delay:.2s}
.view>*:nth-child(n+6){animation-delay:.25s}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:12px}
.h1{margin:0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-.01em}
.h2{margin:0;font-family:var(--serif);font-weight:500;font-size:21px}
.sub{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid rgba(201,204,209,.45);background:var(--surface);color:var(--silver);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:active{transform:scale(.96)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{font-size:14px;font-weight:600;color:var(--silver);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}

.btn{height:52px;border-radius:26px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.985)}
.btn-silver{background:var(--silver-grad);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 28px rgba(201,204,209,.14)}
.btn-brown{background:var(--brown);color:#fff;border:1px solid var(--brown-line)}
.btn-ghost{border:1px solid rgba(201,204,209,.5);color:#fff}
.btn-sm{height:44px;border-radius:22px;font-size:15px;white-space:nowrap}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card-brown{border-radius:20px;background:var(--brown-2);border:1px solid var(--brown-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card-hero{border-radius:24px;background:var(--brown-card);border:1px solid rgba(201,204,209,.30)}
.card-silver{border-radius:20px;background:var(--silver-card);border:1px solid rgba(255,255,255,.45);color:var(--ink)}

.chip{flex-shrink:0;height:38px;padding:0 15px;border-radius:19px;background:var(--brown-2);border:1px solid var(--brown-line);color:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--silver-grad);color:var(--ink);border-color:transparent;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}

.dot{width:7px;height:7px;border-radius:4px;background:var(--sage);display:inline-block;flex-shrink:0}
.pill-sage{font-size:12px;font-weight:600;color:var(--sage);padding:4px 10px;border-radius:12px;background:rgba(169,194,166,.14)}
.badge-silver{font-size:12px;font-weight:600;color:var(--ink);padding:4px 10px;border-radius:12px;background:var(--silver-grad);align-self:flex-start}

.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;min-height:60px}
.list-row+.list-row{border-top:1px solid var(--line-soft)}
.bubble-icon{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bi-sage{background:rgba(169,194,166,.14);color:var(--sage)}
.bi-brown{background:var(--brown);color:#E9DDD2}
.bi-silver{background:rgba(201,204,209,.12);color:var(--silver)}
.rt{display:flex;flex-direction:column;gap:2px;min-width:0;flex-grow:1}
.rt b{font-size:15px;font-weight:500}
.rt span{font-size:13px;color:var(--muted)}
.metric{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.metric b{font-size:26px;font-weight:600;color:var(--silver);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:500}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;height:calc(var(--tabbar) + var(--sb));padding:6px 12px var(--sb);background:rgba(0,0,0,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;z-index:20}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;min-height:48px}
.tab[aria-current="page"]{color:var(--silver-hi);font-weight:600}
.tab[aria-current="page"] [data-i]{filter:drop-shadow(0 0 8px rgba(221,224,228,.4))}

/* ---------- home ---------- */
.ring-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
.ring-hit{border-radius:50%;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:relative}
.ring-hit svg{filter:drop-shadow(0 0 26px rgba(169,194,166,.16))}
.ring-hit svg{display:block}
.ring-hint{font-size:12px;color:var(--muted-2)}
.charge{display:flex;align-items:baseline;gap:10px}
.charge b{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.charge b i{font-style:normal;font-size:.42em;letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.tile .v{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge-arc{transition:stroke-dasharray 1.2s cubic-bezier(.2,.7,.2,1)}
.tap-pulse{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--silver);opacity:0;pointer-events:none}
.tap-pulse.go{animation:tapPulse .6s ease-out}
@keyframes tapPulse{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(1.15)}}

/* ---------- chat ---------- */
.chat-head{position:sticky;top:0;z-index:5;background:var(--black);margin:calc(-1 * (var(--st) + 20px)) -20px 0;padding:calc(var(--st) + 14px) 20px 12px;border-bottom:1px solid var(--line-soft)}
.msgs{display:flex;flex-direction:column;gap:14px;padding-bottom:128px}
.chat-day{align-self:center;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);padding:2px 0}
.msg-user{align-self:flex-end;max-width:80%;padding:11px 16px;border-radius:20px 20px 6px 20px;background:var(--brown);font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-agent{font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-agent.thinking{color:var(--muted);font-style:italic}
.agent-tag{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-2);margin-bottom:4px}
.approval{padding:16px;display:flex;flex-direction:column;gap:12px}
.approval .k{font-size:13px;font-weight:600;color:rgba(22,17,14,.72)}
.approval .li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}
.approval .li svg{flex-shrink:0;margin-top:1px}
.approval.done{background:var(--surface);border:1px solid rgba(169,194,166,.4);color:#fff}
.approval.done .k{color:var(--sage)}
.composer{position:fixed;left:0;right:0;margin:0 auto;max-width:520px;bottom:calc(var(--tabbar) + var(--sb));padding:10px 20px 12px;background:var(--black);border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px;z-index:15}
.composer form{display:flex;align-items:center;gap:8px;margin:0}
.composer input{flex-grow:1;min-width:0;height:48px;padding:0 18px;border-radius:24px;border:1px solid rgba(201,204,209,.28);background:var(--surface);font-size:16px}
.composer input::placeholder{color:var(--muted-2)}
.round{width:48px;height:48px;border-radius:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* ---------- sheets / overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;margin:0 auto;bottom:0;max-width:520px;max-height:86%;overflow-y:auto;background:#0E0C0B;border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;z-index:41;padding:10px 20px calc(24px + var(--sb));transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(201,204,209,.3);margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:26px}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:15px;line-height:1.5}
.sheet textarea{width:100%;min-height:96px;border-radius:16px;border:1px solid rgba(201,204,209,.28);background:var(--surface);padding:14px;font-size:16px;line-height:1.4;resize:vertical}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left;min-height:56px}
.opt+.opt{margin-top:8px}
.opt[aria-checked="true"]{border-color:var(--silver);background:var(--brown-2)}
.opt .radio{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--silver);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--silver)}
.opt[disabled]{opacity:.45}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-20px);background:var(--silver-grad);color:var(--ink);font-weight:600;font-size:14px;padding:12px 18px;border-radius:22px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* switch */
.switch{flex-shrink:0;width:51px;height:31px;border-radius:16px;background:#3A3A3A;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--sage)}
.switch[aria-checked="true"]::after{left:22px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:60px}
.set-row+.set-row{border-top:1px solid var(--line-soft)}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;height:54px;width:100%;text-align:left}
.nav-row+.nav-row{border-top:1px solid var(--line-soft)}

/* ---------- full-screen: splash, voice, onboarding ---------- */
.full{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column}
.splash{background:radial-gradient(85% 50% at 28% 16%,rgba(255,232,210,.10) 0%,rgba(255,232,210,0) 70%),linear-gradient(118deg,rgba(255,240,225,0) 36%,rgba(255,240,225,.04) 46%,rgba(255,240,225,0) 56%),radial-gradient(120% 80% at 50% 44%,#2A1A14 0%,#22140F 48%,#0D0705 100%);align-items:center;justify-content:center;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.mk-arc{stroke-dasharray:100;stroke-dashoffset:100;animation:mkArc .7s cubic-bezier(.65,0,.35,1) forwards}
.mk-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:mkDot .35s cubic-bezier(.34,1.56,.64,1) .65s forwards}
.mk-p{transform-box:fill-box;transform-origin:center;opacity:0}
.mk-p1{animation:mkPulse .55s cubic-bezier(.2,.7,.2,1) 1s}
.mk-p2{animation:mkPulse .55s cubic-bezier(.2,.7,.2,1) 1.25s}
@keyframes mkArc{to{stroke-dashoffset:0}}
@keyframes mkDot{to{transform:scale(1)}}
@keyframes mkPulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}

.voice{background:radial-gradient(70% 45% at 50% 42%,rgba(61,39,28,.55) 0%,rgba(34,20,15,.2) 55%,rgba(0,0,0,0) 100%),#000;align-items:center;justify-content:space-between;padding:calc(28px + var(--st)) 24px calc(32px + var(--sb));opacity:0;transition:opacity .25s}
.voice.on{opacity:1}
.voice-orb{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center}
.voice-orb .wave{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(201,204,209,.5);animation:wave 1.8s ease-out infinite;opacity:0}
.voice-orb .wave:nth-child(2){animation-delay:.6s}
.voice-orb .wave:nth-child(3){animation-delay:1.2s}
@keyframes wave{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.voice.busy .wave{animation-duration:.9s;border-color:rgba(169,194,166,.6)}
.transcript{font-family:var(--serif);font-size:28px;line-height:1.25;text-align:center;min-height:106px;max-width:420px}
.vstate{font-size:14px;color:var(--muted);text-align:center}

.onb{background:#000;padding:calc(20px + var(--st)) 24px calc(24px + var(--sb));overflow-y:auto}
.onb-inner{max-width:460px;margin:0 auto;width:100%;flex-grow:1;display:flex;flex-direction:column;gap:20px}
.progress{display:flex;gap:6px}
.progress i{height:3px;flex-grow:1;border-radius:2px;background:rgba(201,204,209,.2)}
.progress i.on{background:var(--silver)}
.onb h2{margin:0;font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1;letter-spacing:-.01em}
.onb .lead{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.onb-art{flex-grow:1;display:flex;align-items:center;justify-content:center;min-height:240px;position:relative}
.onb-foot{display:flex;flex-direction:column;gap:10px}
.search-wave{position:absolute;width:220px;height:220px;border-radius:50%;border:1.5px solid rgba(201,204,209,.35);animation:wave 2s ease-out infinite;opacity:0}
.search-wave.b{animation-delay:.7s}.search-wave.c{animation-delay:1.4s}
.found-check{position:absolute;right:calc(50% - 88px);top:calc(50% - 88px);width:36px;height:36px;border-radius:18px;background:var(--sage);color:var(--ink);display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.found-check.on{transform:scale(1)}

.tab-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wf{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:72px}
.wf+.wf{border-top:1px solid var(--line-soft)}
.wf-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex-grow:1;text-align:left}
.wf-main b{font-size:15px;font-weight:600}
.wf-main span{font-size:13px;color:var(--muted);line-height:1.35}
.trig{align-self:flex-start;font-size:10.5px;font-weight:600;color:var(--silver);text-transform:uppercase;letter-spacing:.07em;padding:4px 9px;border-radius:10px;background:rgba(201,204,209,.10);border:1px solid rgba(201,204,209,.18)}
.conn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.conn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;min-height:84px;font-size:12px;font-weight:500;text-align:center}
.conn .ci{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}
.conn .ci .ok{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:7px;background:var(--sage);border:2px solid #000}
.conn-row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:60px}
.conn-row+.conn-row{border-top:1px solid var(--line-soft)}
.alert-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--silver-card);color:var(--ink);text-align:left;width:100%}

.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{height:52px;border-radius:14px;border:1px solid rgba(201,204,209,.28);background:var(--surface);padding:0 16px;font-size:16px}
.field input:focus{border-color:var(--silver);outline:none}
.err{font-size:13px;color:#E8A598;min-height:18px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted-2);font-size:13px}
.divider::before,.divider::after{content:"";flex-grow:1;height:1px;background:var(--line-soft)}
.code-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.code-row input{height:58px;text-align:center;font-size:24px;font-family:var(--serif);border-radius:14px;border:1px solid rgba(201,204,209,.28);background:var(--surface);padding:0}
.code-row input:focus{border-color:var(--silver);outline:none}
.textbtn{font-size:15px;font-weight:600;color:var(--silver);min-height:44px;padding:0 4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

}

  if(tab==='home')renderHome();
  if(tab==='groups')renderGroups();
  if(tab==='agent')renderAgent();
  if(tab==='profile')renderProfile();
  updateBadge();
  if(tab==='chat'){renderChat();setTimeout(()=>SC().scrollTo({top:SC().scrollHeight,behavior:'instant'}),0)}

function guessWorkflow(text){
  const t=text.toLowerCase();
  const uses=[];
  if(/text|message|invite|tell|reply/.test(t))uses.push('messages');
  if(/calendar|meeting|event|schedule|busy|free/.test(t))uses.push('calendar');
  if(/near|leave|rain|weather|walk|home|work|arrive/.test(t))uses.push('location');
  if(/dinner|lunch|restaurant|table|book/.test(t))uses.push('dining');
  if(/email|inbox|mail/.test(t))uses.push('mail');
  if(/music|song|playlist/.test(t))uses.push('music');
  if(/ride|uber|lyft/.test(t))uses.push('rides');
  if(/remind/.test(t))uses.push('reminders');
  const m=text.match(/^(every [^,]+|when [^,]+|if [^,]+|each [^,]+)/i);
  const trig=m?m[1].replace(/^./,c=>c.toUpperCase()):'When you ask';
  const rest=m?text.slice(m[0].length).replace(/^[,\s]+/,''):text;
  const clause=rest.replace(/[.!?]+$/,'').split(/\s+(?:and|then|so)\s+/i)[0];
  const words=clause.split(/\s+/).slice(0,5).join(' ').replace(/\s+(?:a|an|the|to|and|for|with)$/i,'');
  return {title:words.charAt(0).toUpperCase()+words.slice(1),trig,desc:text.replace(/[.!]*$/,'.'),uses:[...new Set(uses)]};
}
async function createWorkflow(text){
  let wf=null;
  const sample=await getSample();
  if(sample){
    try{
      const keys=CONNS.map(c=>c.k).join(', ');
      wf=await sample.json(`Turn this request for a personal AI agent into a workflow. Request: "${text}"
Return JSON only: {"title": short name, 2 to 4 words, sentence case; "trig": when it runs, under 32 characters, like "Fridays · 5 PM" or "When you leave work"; "desc": one plain sentence under 90 characters describing what the agent does; "uses": array of connector keys it needs, chosen only from [${keys}]}`,{modelTier:'quick'});
      if(!wf||!wf.title)wf=null;else wf.uses=(wf.uses||[]).filter(k=>CONNS.some(c=>c.k===k));
    }catch(e){wf=null}
  }
  if(!wf)wf=guessWorkflow(text);
  const w={title:String(wf.title).slice(0,40),desc:String(wf.desc).slice(0,120),trig:String(wf.trig).slice(0,40),uses:wf.uses,on:true,confirm:true,custom:true};
  S.wfs.unshift(w);saveState();renderAgent();
  const missing=w.uses.filter(k=>!isConn(k));
  if(missing.length){w.on=false;saveState();renderAgent();openSheet('wf',0)}else toast('Workflow created');
}

/* ================= BACKEND API ================= */
// When served by backend/server.js (same origin), chat goes through the real
// agent loop and approvals can arrive from the API. Opened as a plain static
// file, everything falls back to the on-device sample behavior.
const API={on:false,health:null};
async function apiInit(){
  try{
    const r=await fetch('/api/health',{cache:'no-store'});
    if(r.ok){API.on=true;API.health=await r.json();}
  }catch(e){/* static file — stay on sample behavior */}
}
function approvalFromTool(p){
  const a=p.args||{};
  const base={approvalId:p.id,status:'pending',role:'approval'};
  if(p.name==='gmail_send')return{...base,book:`Send email to ${a.to}`,text:(a.subject?a.subject+': ':'')+(a.body||''),to:a.to||''};
  if(p.name==='calendar_create')return{...base,book:`Add to calendar: ${a.summary||'Event'}`,text:`${a.start||''}${a.location?' · '+a.location:''}`,to:'Calendar'};
  return{...base,book:p.name,text:JSON.stringify(a).slice(0,140),to:''};
}
function backendStatusLine(){
  if(!API.on||!API.health)return '';
  const c=API.health.connectors||{};
  const map={mail:'gmail',calendar:'calendar',rides:'uber',dining:'dining'};
  const bits=Object.entries(map).map(([k,bk])=>{const s=c[bk];const label=(CONNS.find(x=>x.k===k)||{n:k}).n;
    return `${label}: ${s?(s.ok?'live':'needs key'):'—'}`;});
  const llm=API.health.llm&&API.health.llm!=='canned-fallback'?'live ('+esc(API.health.llm)+')':'preview mode';
  return `<div class="card" style="padding:12px 14px;margin-bottom:12px"><span style="font-size:12.5px;color:var(--muted)">Backend · agent ${llm} — ${bits.join(' · ')}</span></div>`;
}

/* ================= GROUPS ================= */
// Group threads live on the backend (/api/threads). Mention @ring and the
// agent joins with full thread context; its held approvals land in-thread.
let G={threads:[],open:null,es:null};
async function apiJSON(url,opts){
  const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok)throw new Error('request failed');
  return r.json();
}
function approvalLabel(p){
  const a=p.args||{};
  if(p.name==='gmail_send')return `Send email to ${a.to||'?'}`;
  if(p.name==='calendar_create')return `Add to calendar: ${a.summary||'event'}`;
  return p.describe||p.name;
}
function gMsgHTML(m){
  if(m.from==='agent'){
    return `<div><div class="agent-tag">${mark(12,'#8F857D')}Agent</div><div class="msg-agent">${esc(m.text)}</div>${(m.pendingApprovals||[]).map(p=>`
      <section class="card-silver approval" aria-label="Needs your OK" style="margin-top:8px">
        <div class="k">Needs your OK</div>
        <div class="li"><span style="color:#22140F;display:inline-flex">${I.cal}</span><span>${esc(approvalLabel(p))}</span></div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <button class="btn btn-brown btn-sm" data-gapprove="${p.id}">Approve</button>
          <button class="btn btn-sm" style="border:1px solid rgba(22,17,14,.35);color:#16110E" data-gdecline="${p.id}">Decline</button>
        </div>
      </section>`).join('')}</div>`;
  }
  if(m.from==='you')return `<div class="msg-user">${esc(m.text)}</div>`;

}
function bindGApprovals(root){
  root.querySelectorAll('[data-gapprove],[data-gdecline]').forEach(b=>b.onclick=()=>gResolve(b.dataset.gapprove||b.dataset.gdecline,b));
}
async function gResolve(id,btn){
  const decision=btn.hasAttribute('data-gdecline')?'decline':'approve';
  btn.disabled=true;
  try{await apiJSON(`/api/approvals/${id}/resolve`,{method:'POST',body:JSON.stringify({decision})})}catch(e){}
  renderGroups();
}
async function createThread(){
  const name=($('#ng-name')||{}).value?.trim()||'New group';
  const members=(($('#ng-members')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean);
  closeSheet();
  if(!API.on){toast('Groups need the backend — run npm start');return}
  try{
    const t=await apiJSON('/api/threads',{method:'POST',body:JSON.stringify({name,members})});
    G.open=t.id;go('groups');
  }catch(e){toast('Could not create group')}
}
function closeThreadStream(){if(G.es){G.es.close();G.es=null}}
function closeThread(){closeThreadStream();G.open=null}
function openThreadStream(){
  closeThreadStream();
  if(!G.open||!API.on)return;
  try{
    G.es=new EventSource(`/api/threads/${G.open}/stream`);
    G.es.onmessage=e=>{
      try{
        const ev=JSON.parse(e.data);
        if(ev.type==='message'&&S.tab==='groups'&&G.open){
          const box=$('#g-msgs');
          if(box){box.insertAdjacentHTML('beforeend',gMsgHTML(ev.message));box.scrollTop=box.scrollHeight;paintIcons(box);bindGApprovals(box)}
        }
      }catch(err){}
    };
  }catch(e){}
}
async function renderGroups(){

  if(!API.on){
    v.innerHTML=head+`<div class="card" style="padding:18px"><b class="serif" style="font-size:19px;font-weight:400">Group chats live on the backend.</b><p style="margin-top:8px;font-size:14.5px;color:var(--muted)">Run the app with npm start and your threads, @ring mentions and shared plans show up here.</p></div>`;
    paintIcons(v);return;
  }
  if(!G.open){
    try{G.threads=await apiJSON('/api/threads')}catch(e){G.threads=[]}
    v.innerHTML=head+(G.threads.length
      ?`<div style="display:flex;flex-direction:column;gap:10px">${G.threads.map(t=>{const last=(t.messages||[])[0];return `<button class="card-brown" data-thread="${t.id}" style="text-align:left;width:100%;padding:14px 16px;border-radius:16px"><div class="rt"><b class="serif" style="font-size:19px;font-weight:400">${esc(t.name)}</b><span>${esc((t.members||[]).join(', ')||'Just you')}</span>${last?`<span style="margin-top:4px;color:var(--muted)">${esc(last.from)}: ${esc(last.text.slice(0,60))}</span>`:''}</div></button>`}).join('')}</div>`
      :`<div class="card" style="padding:18px"><b class="serif" style="font-size:19px;font-weight:400">No groups yet.</b><p style="margin-top:8px;font-size:14.5px;color:var(--muted)">Start one, add people, and mention <b>@ring</b> whenever you want the agent to weigh in — or book something for everyone.</p></div>`);
  }else{
    const t=G.threads.find(x=>x.id===G.open)||{name:'Group'};
    let msgs=[];
    try{msgs=await apiJSON(`/api/threads/${G.open}/messages`)}catch(e){}
    v.innerHTML=head.replace('>Groups</h1>',`>${esc(t.name)}</h1>`)+`
      <div style="margin:-14px 0 4px"><button class="chip" id="g-back" style="height:32px;font-size:13px">‹ All groups</button></div>
      <div class="msgs" id="g-msgs" style="min-height:40vh" aria-live="polite">${msgs.map(gMsgHTML).join('')}</div>
      <form id="g-form" style="display:flex;gap:8px;margin-top:8px"><input id="g-input" placeholder="Message @ring to bring in the agent…" autocomplete="off" aria-label="Group message" style="flex:1;min-width:0;height:48px;padding:0 18px;border-radius:24px;border:1px solid rgba(201,204,209,.28);background:var(--surface);font-size:16px;color:#fff"><button class="btn btn-brown btn-sm" style="width:auto;padding:0 18px">Send</button></form>`;
    const box=$('#g-msgs');box.scrollTop=box.scrollHeight;
    $('#g-back').onclick=()=>{closeThread();renderGroups()};
    $('#g-form').onsubmit=async e=>{e.preventDefault();const inp=$('#g-input');const text=inp.value.trim();if(!text)return;inp.value='';try{await apiJSON(`/api/threads/${G.open}/messages`,{method:'POST',body:JSON.stringify({from:'you',text})})}catch(err){}};
    openThreadStream();
  }
  paintIcons(v);

}

  $('#chat-mark').innerHTML=mark(22,'#C9CCD1','#A9C2A6');

    if(m.role==='agent')return `<div><div class="agent-tag">${mark(12,'#8F857D')}Agent</div><div class="msg-agent${m.thinking?' thinking':''}" data-mi="${i}">${esc(m.text)}</div></div>`;

    if(m.role==='approval'){

      return `<section class="${done?'card':'card-silver'} approval${done?' done':''}" aria-label="${done?'Done':'Needs your OK'}">
        <div class="k">${done?'Done':'Needs your OK'}</div>
        <div class="li"><span style="color:${done?'var(--sage)':'#22140F'};display:inline-flex">${done?I.check:I.cal}</span><span>${esc(m.book)}</span></div>
        <div class="li"><span style="color:${done?'var(--sage)':'#22140F'};display:inline-flex">${done?I.check:I.msg}</span><span>Text ${esc(m.to)}: "${esc(m.text)}"</span></div>
        ${done?'':`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="btn btn-brown btn-sm" data-approve="${i}">Do both</button><button class="btn btn-sm" style="border:1px solid rgba(22,17,14,.35);color:#16110E" data-edit="${i}">Edit</button></div>`}

function scrollChat(){SC().scrollTo({top:SC().scrollHeight,behavior:'smooth'})}
function approve(i){

  if(a.approvalId&&API.on){
    fetch(`/api/approvals/${a.approvalId}/resolve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:'approve'})}).catch(()=>{});

}

let sampleFn=null, sampleTried=false;
async function getSample(){
  if(sampleTried)return sampleFn;sampleTried=true;
  try{if(window.claude&&window.claude.use){sampleFn=await window.claude.use('sample')}}catch(e){sampleFn=null}
  return sampleFn;

function contextPrompt(){
  const hist=S.chat.filter(m=>m.role==='user'||m.role==='agent'&&!m.thinking).slice(-10).map(m=>(m.role==='user'?'User: ':'Agent: ')+m.text).join('\n');
  return `You are the voice agent inside a smart ring's companion app. The user talks to you through the ring (double-tap) or this chat. You handle messages (iMessage), calendar, reminders and local discovery.
Context (sample data): It is ${timeStr(new Date())} on ${dateStr}. User is in [Neighborhood], walking. Next event: dinner with [Friend] at 7:30 PM, 14 min walk. Friends: Sam, Mom. Likes quiet places before 8, ramen, walks under 20 minutes. Permissions: messages ${S.perms.messages?'on':'off'}, calendar ${S.perms.calendar?'on':'off'}, location ${S.perms.location?'on':'off'}; ask before acting is ${S.perms.confirm?'on':'off'}.
Style: warm, brief, concrete. 1 to 3 short sentences. No markdown, no lists, no emojis. Use placeholder names in brackets like [Venue name] for real businesses. If an action would send or book something and ask-before-acting is on, say what you'd do and ask for OK.

Conversation so far:
${hist}

Reply as the Agent to the user's last message.`;

async function send(text){
  text=String(text||'').trim(); if(!text||S.busy)return;
  S.chat.push({role:'user',text});renderChat();scrollChat();
  const key=text.toLowerCase();
  if(CANNED[key]){
    S.busy=true;const th={role:'agent',text:'Thinking…',thinking:true};S.chat.push(th);renderChat();scrollChat();
    await new Promise(r=>setTimeout(r,700));
    S.chat.pop();CANNED[key].forEach(m=>S.chat.push(JSON.parse(JSON.stringify(m))));S.busy=false;renderChat();scrollChat();return;
  }
  S.busy=true;
  const msg={role:'agent',text:'Thinking…',thinking:true};S.chat.push(msg);renderChat();scrollChat();
  const idx=S.chat.length-1;
  if(API.on){
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
      if(r.ok){
        const data=await r.json();
        msg.thinking=false;msg.text=data.text||'Done.';
        (data.pendingApprovals||[]).forEach(p=>S.chat.push(approvalFromTool(p)));
        S.busy=false;saveState();renderChat();scrollChat();return;
      }
    }catch(e){/* fall through to on-device sample */}
  }
  const sample=await getSample();
  if(!sample){
    await new Promise(r=>setTimeout(r,600));
    msg.thinking=false;msg.text="In the full app I'd handle that right away. This preview runs on sample data, so try one of the suggestions below.";
    S.busy=false;renderChat();scrollChat();return;
  }
  try{
    await sample(contextPrompt(),{modelTier:'quick',cache:false,onText:({text})=>{msg.thinking=false;msg.text=text;const el=document.querySelector(`.msg-agent[data-mi="${idx}"]`);if(el){el.classList.remove('thinking');el.textContent=text}}});
  }catch(e){
    msg.thinking=false;
    msg.text=e&&e.text?e.text:(e&&e.code==='not_granted'?"Live answers are off for this preview. Try one of the suggestions below.":"I couldn't reach the agent just now. Try again in a moment.");
  }
  S.busy=false;renderChat();scrollChat();
}
$('#ask-form').onsubmit=e=>{e.preventDefault();const v=$('#ask').value;$('#ask').value='';send(v)};
$('#mic').onclick=()=>openVoice();

/* ================= VOICE ================= */
const PHRASES=["Where should I eat dinner close by?","What's fun near me tonight?","Catch me up on texts","What's tomorrow?"];
let vp=0,vTimers=[];
function openVoice(){
  const v=$('#voice');v.classList.remove('hidden','busy');
  $('#voice-mark').innerHTML=mark(64,'#C9CCD1','#A9C2A6');
  $('#vstate').textContent='Listening';$('#transcript').textContent='';
  requestAnimationFrame(()=>v.classList.add('on'));
  $('#voice-stop').focus();
  const phrase=PHRASES[vp++%PHRASES.length];
  let i=0;
  vTimers.push(setTimeout(function type(){
    const words=phrase.split(' ');
    $('#transcript').textContent=words.slice(0,++i).join(' ');
    if(i<words.length)vTimers.push(setTimeout(type,170));
    else vTimers.push(setTimeout(()=>{v.classList.add('busy');$('#vstate').textContent='Working on it';vTimers.push(setTimeout(()=>{closeVoice();go('chat');send(phrase)},900))},500));
  },900));
}
function closeVoice(cancel){
  vTimers.forEach(clearTimeout);vTimers=[];
  const v=$('#voice');v.classList.remove('on');setTimeout(()=>v.classList.add('hidden'),250);
  if(cancel)toast('Stopped');
}
$('#voice-stop').onclick=()=>closeVoice(true);

/* ================= AUTH ================= */
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
let authView='welcome', pendingAcc=null;
function showAuth(view){authView=view||'welcome';$('#auth').classList.remove('hidden');renderAuth()}
function hideAuth(){$('#auth').classList.add('hidden');$('#auth').innerHTML=''}
const backBtn='<button class="iconbtn" id="au-back" aria-label="Back" style="align-self:flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>';
const socials=`<div style="display:flex;flex-direction:column;gap:8px">
  <button class="btn" data-social="Apple" style="background:#FFFFFF;color:#000">Continue with Apple</button>
  <button class="btn btn-ghost" data-social="Google">Continue with Google</button></div>`;
function field(id,label,type,ac,val){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" autocomplete="${ac}" value="${esc(val||'')}"${type==='email'?' inputmode="email" autocapitalize="off" spellcheck="false"':''}><div class="err" id="${id}-err"></div></div>`}
function renderAuth(){
  const el=$('#auth');
  const V={
    welcome:()=>`<div class="onb-inner" style="justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px;padding-top:8px">${mark(28,'#FFFFFF')}<span class="serif" style="font-size:22px">[Name]</span></div>
      <div class="onb-art">${ringArt(270)}</div>
      <h2>Your assistant, on your finger.</h2>
      <p class="lead">Double-tap your ring and just talk. It texts, plans and finds places for you, while your phone stays in your pocket.</p>
      <div class="onb-foot">
        <button class="btn btn-silver" data-to="signup">Create account</button>
        <button class="btn btn-ghost" data-to="login">Log in</button>
        <p class="sub" style="text-align:center;margin:6px 0 0;font-size:12px">By continuing you agree to the Terms and Privacy Policy.</p>
      </div></div>`,
    signup:()=>`<div class="onb-inner">${backBtn}
      <h2>Create your account</h2>
      ${socials}
      <div class="divider">or with email</div>
      <form id="su-form" novalidate style="display:flex;flex-direction:column;gap:10px;margin:0">
        ${field('su-name','Name','text','name')}
        ${field('su-email','Email','email','email')}
        <div class="field"><label for="su-pass">Password</label><div style="position:relative"><input id="su-pass" type="password" autocomplete="new-password" style="width:100%;padding-right:70px"><button type="button" class="textbtn" id="su-show" style="position:absolute;right:8px;top:4px">Show</button></div><div class="err" id="su-pass-err"></div></div>
        <button class="btn btn-silver" type="submit">Create account</button>
      </form>
      <p class="sub" style="text-align:center;margin:0">Already have an account? <button class="textbtn" data-to="login">Log in</button></p></div>`,
    verify:()=>`<div class="onb-inner">${backBtn}
      <h2>Check your email</h2>
      <p class="lead">We sent a 6-digit code to <span style="color:#fff">${esc(pendingAcc?pendingAcc.email:'')}</span>. Any 6 digits work in this prototype.</p>
      <div class="code-row" role="group" aria-label="Verification code">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" data-ci="${i}" autocomplete="${i?'off':'one-time-code'}">`).join('')}</div>
      <div class="err" id="code-err"></div>
      <div style="flex-grow:1"></div>
      <div class="onb-foot"><button class="btn btn-silver" id="verify" disabled>Verify</button><button class="textbtn" id="resend" style="align-self:center">Resend code</button></div></div>`,
    login:()=>`<div class="onb-inner">${backBtn}
      <h2>Welcome back</h2>
      ${socials}
      <div class="divider">or with email</div>
      <form id="li-form" novalidate style="display:flex;flex-direction:column;gap:10px;margin:0">
        ${field('li-email','Email','email','email')}
        ${field('li-pass','Password','password','current-password')}
        <button type="button" class="textbtn" data-to="forgot" style="align-self:flex-end;margin-top:-6px">Forgot password?</button>
        <button class="btn btn-silver" type="submit">Log in</button>
      </form>
      <p class="sub" style="text-align:center;margin:0">New here? <button class="textbtn" data-to="signup">Create account</button></p></div>`,
    forgot:()=>`<div class="onb-inner">${backBtn}
      <h2>Reset your password</h2>
      <p class="lead">Enter your email and we'll send you a link to set a new one.</p>
      <form id="fp-form" novalidate style="display:flex;flex-direction:column;gap:10px;margin:0">
        ${field('fp-email','Email','email','email')}
        <button class="btn btn-silver" type="submit">Send reset link</button>
      </form></div>`,
  };
  el.innerHTML=V[authView]();
  el.scrollTop=0;
  el.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{authView=b.dataset.to;renderAuth()});
  const back=$('#au-back');if(back)back.onclick=()=>{authView=authView==='verify'?'signup':authView==='forgot'?'login':'welcome';renderAuth()};
  el.querySelectorAll('[data-social]').forEach(b=>b.onclick=()=>{
    const isNew=authView==='signup';
    finishAuth({name:'[Your name]',email:'you@'+b.dataset.social.toLowerCase()+'.com',via:b.dataset.social},isNew);
  });
  const setErr=(id,m)=>{const e=$('#'+id+'-err');if(e)e.textContent=m||'';const i=$('#'+id);if(i)i.setAttribute('aria-invalid',m?'true':'false')};
  const su=$('#su-form');
  if(su){
    $('#su-show').onclick=()=>{const p=$('#su-pass');const show=p.type==='password';p.type=show?'text':'password';$('#su-show').textContent=show?'Hide':'Show'};
    su.onsubmit=e=>{e.preventDefault();
      const n=$('#su-name').value.trim(),m=$('#su-email').value.trim(),p=$('#su-pass').value;
      setErr('su-name',n?'':'Enter your name');setErr('su-email',EMAIL_RE.test(m)?'':'Enter a valid email');setErr('su-pass',p.length>=8?'':'Use at least 8 characters');
      if(!n||!EMAIL_RE.test(m)||p.length<8){const f=su.querySelector('[aria-invalid="true"]');if(f)f.focus();return}
      pendingAcc={name:n,email:m};authView='verify';renderAuth();
    };
    setTimeout(()=>$('#su-name').focus(),50);
  }
  const li=$('#li-form');
  if(li){li.onsubmit=e=>{e.preventDefault();
      const m=$('#li-email').value.trim(),p=$('#li-pass').value;
      setErr('li-email',EMAIL_RE.test(m)?'':'Enter a valid email');setErr('li-pass',p?'':'Enter your password');
      if(!EMAIL_RE.test(m)||!p)return;
      const nm=m.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      finishAuth({name:nm,email:m},false);
    };setTimeout(()=>$('#li-email').focus(),50)}
  const fp=$('#fp-form');
  if(fp){fp.onsubmit=e=>{e.preventDefault();const m=$('#fp-email').value.trim();setErr('fp-email',EMAIL_RE.test(m)?'':'Enter a valid email');if(!EMAIL_RE.test(m))return;toast('Reset link sent');authView='login';renderAuth()}}
  const boxes=[...el.querySelectorAll('[data-ci]')];
  if(boxes.length){
    const check=()=>{$('#verify').disabled=!boxes.every(b=>/^\d$/.test(b.value))};
    boxes.forEach((b,i)=>{
      b.oninput=()=>{b.value=b.value.replace(/\D/g,'').slice(-1);if(b.value&&boxes[i+1])boxes[i+1].focus();check()};
      b.onkeydown=e=>{if(e.key==='Backspace'&&!b.value&&boxes[i-1]){boxes[i-1].focus();boxes[i-1].value='';check()}};
      b.onpaste=e=>{e.preventDefault();const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);d.split('').forEach((c,j)=>{if(boxes[j])boxes[j].value=c});(boxes[Math.min(d.length,5)]).focus();check()};
    });
    setTimeout(()=>boxes[0].focus(),50);
    $('#verify').onclick=()=>finishAuth(pendingAcc,true);
    $('#resend').onclick=()=>toast('New code sent');
  }
}
function finishAuth(acc,isNew){
  S.account=acc;store.set('account',acc);
  hideAuth();
  if(isNew){store.set('onboarded',false);startOnboarding()}
  else{store.set('onboarded',true);go('home');toast('Welcome back')}
}

/* ================= ONBOARDING (ring setup) ================= */
let ob=0;
function startOnboarding(){ob=0;$('#onb').classList.remove('hidden');renderOnb()}
function renderOnb(){
  const el=$('#onb');
  const first=(S.account&&S.account.name&&!/^\[/.test(S.account.name))?S.account.name.split(' ')[0]:'';
  const prog=`<div class="progress" aria-label="Step ${ob+1} of 3">${[0,1,2].map(i=>`<i class="${i<=ob?'on':''}"></i>`).join('')}</div>`;
  const steps=[
    ()=>`<div class="onb-inner">${prog}
      <h2>${first?esc(first)+', let':'Let'}'s find your ring.</h2>
      <p class="lead">Put it on and keep your phone close.</p>
      <div class="onb-art"><i class="search-wave"></i><i class="search-wave b"></i><i class="search-wave c"></i>${ringArt(200)}<span class="found-check" id="found">${I.check}</span></div>
      <p class="vstate" id="pair-state" aria-live="polite">Searching…</p>
      <div class="onb-foot"><button class="btn btn-silver" id="ob-next" disabled>Connect</button></div></div>`,
    ()=>`<div class="onb-inner">${prog}
      <h2>Now try the double-tap.</h2>
      <p class="lead">Tap your ring twice, like knocking. Here, tap the ring below twice.</p>
      <div class="onb-art"><div class="ring-hit" id="ob-ring" role="button" tabindex="0" aria-label="Double-tap the ring">${ringArt(220)}<i class="tap-pulse" id="ob-tp"></i></div></div>
      <p class="vstate" id="tap-state" aria-live="polite">Waiting for a double-tap</p>
      <div class="onb-foot"><button class="btn btn-silver" id="ob-next" disabled>Continue</button></div></div>`,
    ()=>`<div class="onb-inner">${prog}
      <h2>Connect the essentials.</h2>
      <p class="lead">Your agent works through these. Add more anytime in Agent.</p>
      <div class="card" style="overflow:hidden">
        ${['messages','calendar','location','contacts'].map(k=>{const c=CONNS.find(x=>x.k===k);return `<div class="set-row"><span class="bubble-icon bi-brown">${I[c.i]}</span><div class="rt"><b>${c.n}</b><span>${c.d}</span></div><button class="switch" role="switch" aria-checked="${isConn(k)}" aria-label="${c.n}" data-oc="${k}"></button></div>`}).join('')}
      </div>
      <div class="card" style="overflow:hidden"><div class="set-row"><div class="rt"><b>Ask before acting</b><span>Confirm anything sent or booked</span></div><button class="switch" role="switch" aria-checked="${S.perms.confirm}" aria-label="Ask before acting" data-oc="confirm"></button></div></div>
      <div style="flex-grow:1"></div>
      <div class="onb-foot"><button class="btn btn-silver" id="ob-next">Finish setup</button></div></div>`,
  ];
  el.innerHTML=steps[ob]();
  const next=$('#ob-next');
  next.onclick=()=>{if(ob<2){ob++;renderOnb()}else{store.set('onboarded',true);saveState();el.classList.add('hidden');el.innerHTML='';go('home');toast("You're all set")}};
  if(ob===0){setTimeout(()=>{const f=$('#found'),s=$('#pair-state');if(!f)return;f.classList.add('on');s.textContent='Found your ring · 82% charged';next.disabled=false;next.focus()},1800)}
  if(ob===1){let last=0;const r=$('#ob-ring');const done=()=>{$('#tap-state').textContent="That's it. Double-tap anytime to talk.";$('#tap-state').style.color='var(--sage)';next.disabled=false;next.focus()};
    r.onclick=()=>{const tp=$('#ob-tp');tp.classList.remove('go');void tp.offsetWidth;tp.classList.add('go');const t=Date.now();if(t-last<420)done();last=t};
    r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();done()}}}
  if(ob===2){el.querySelectorAll('[data-oc]').forEach(b=>b.onclick=()=>{const k=b.dataset.oc;const v=!(k==='confirm'?S.perms.confirm:isConn(k));if(k==='confirm')S.perms.confirm=v;else setConn(k,v);b.setAttribute('aria-checked',v)})}
}

/* ================= device fit ================= */
function fitDevice(){
  const d=$('#device');
  if(innerWidth>=600){const k=Math.min(1,(innerHeight-48)/880,(innerWidth-48)/420);d.style.transform=`scale(${k.toFixed(3)})`}
  else d.style.transform='translateZ(0)';
}
addEventListener('resize',fitDevice);
function tickClock(){const t=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,'');const e=$('#sbar-time');if(e)e.textContent=t}

/* ================= boot ================= */
paintIcons();
fitDevice();tickClock();setInterval(tickClock,30000);
go('home');
const splash=$('#splash');
const endSplash=()=>{if(splash.classList.contains('out'))return;splash.classList.add('out');setTimeout(()=>splash.remove(),460);
  if(!S.account)showAuth('welcome');else if(!store.get('onboarded',false))startOnboarding()};
setTimeout(endSplash,1900);
splash.addEventListener('click',endSplash);
getSample();
apiInit();
})();
</script>
